    display: flex;
    width:500px;
    height:33px;
    line-height:33px;

}
.title h2{
    margin:0;
    font-size:16px;
}
.title a{
    text-decoration:none;
    font-size:14px;
}

.title:nth-child(2) h2{
    flex-grow:1;
}
.title:nth-child(3){
    position:relative;
    border-bottom:1px solid #ccc;
}
.title:nth-child(3) a{
    position:absolute;
    right:10px;
    top:0;
}
</style>
</head>
