<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 群组选择器：同时清除h2、h3、p标签的内外边距 */
        h2,h3,p{
            padding:0;
            margin:0;
        }
        /* 后代选择器，id为box的容器样式 */
        #box{
            width:480px;
            padding:8px;
            border:1px solid #ccc;
            font-size:12px;
            margin:20px;
        }
        /* 后代选择器：选中box里面的h3 */
        #box h3{
            font-size: 16px;
            text-align: center;
            line-height: 33px;
            letter-spacing: 3px;
            color: #952b2b;
        }
        /* 后代选择器：选中box里面的p段落 */
        #box p{
            line-height: 150%;
            color: rgb(101, 104, 104);
            text-indent: 2em; /* 首行缩进2字符 */
        }
        /* 后代选择器：选中box里面的a超链接 */
        #box a{
            color: rgb(101, 104, 104);
            text-decoration: none; /* 取消下划线 */
        }
        /* 鼠标悬浮在a标签上的样式 */
        #box a:hover{
            color: rgb(255, 0, 0);
        }
        /* 学号：蓝色加粗 */
        .stu-id{
            color: blue;
            font-weight: bold;
        }
        /* 姓名：深色加粗 */
        .yname{
            color: #222;
            font-weight: bold;
        }
        /* 难度文字：红色加粗 */
        .hard{
            color: red;
            font-weight: bold;
        }
        /* 知识点：紫色边框 */
        .knowledge{
            border:1px solid purple;
            padding:2px;
        }
    </style>
</head>
<body>
    <h2>CSS进阶</h2>
    <div id="box">
     <h3>CSS那些事</h3>
     <p>
        <span class="stu-id">学号：301</span>，姓名：<span class="yname">关泉才</span>，班级：计算机24003，对于《高级网页设计》课程的难度认知为：<span class="hard">难</span>，
        <span class="knowledge">这个例子对应的知识点是: 群组选择器、后代选择器、层叠与继承。</span>
            <a href="#">更多>></a>
     </p>
    </div>
<!--扩展： 学号：蓝色加粗；姓名：深色加粗，难度的值：红色加粗，知识点，紫色边框，边框为额外内容,使用内部css-->
</body>
</html>
