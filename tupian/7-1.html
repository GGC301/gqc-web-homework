<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上图下文</title>
    <style>
        .list{
            display: flex;
            /* 取消列表默认黑点 */
            list-style: none;
            padding: 0;
            gap: 15px;
        }
        .list li{
            width: 200px;
            border: 1px solid #999;
            text-align: center;
        }
        .list li img{
            width: 100%;
            height: 140px;
        }
    </style>
</head>
<body>
    <ul class="list">
        <li>
            <img src="https://picsum.photos/id/237/200/140" alt="小狗">
            <p>可爱小狗</p>
        </li>
        <li>
            <img src="https://picsum.photos/id/10/200/140" alt="山脉">
            <p>山间风景</p>
        </li>
        <li>
            <img src="https://picsum.photos/id/15/200/140" alt="海边">
            <p>海岸风光</p>
        </li>
    </ul>
</body>
</html>
