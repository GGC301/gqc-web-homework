<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>301关泉才</title>
    <style>
        p{
            color: red;
            font-size: 50px;
        }
        #box{
            width: 600px;
            height: 500px;
            background-color: #1a55c2;
        }
        .n1{
            color: #252222;
        }
        /*扩展2 h2黑底白字*/
        h2{
            background-color: black;
            color: white;
        }
        /*扩展3 选择器三个字白色*/
        .white-text{
            color:white;
        }
        /*扩展1 关泉才 每个字不同颜色*/
        .zi1{color:red;}
        .zi2{color:yellow;}
        .zi3{color:lime;}
    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
    <div id="box">
        <p>CSS<span class="white-text">选择器</span></p>
        <p>
            <span class="zi1">关</span><span class="zi2">泉</span><span class="zi3">才</span>
        </p>
        <p>CSS属性</p>
    </div>
</body>
</html>
