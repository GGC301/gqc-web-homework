<html lang="en">
<head>
    <title>document</title>
</head>
<body>
    <h2>关泉才的JavaScript</h2>
    <script>
        document.write("<h3>hello world,关泉才</h3>");
        alert("hello world");
        console.log("hello world,guanquancai");
        // prompt和confirm
        var name = prompt("请输入您的姓名");
        alert("您的姓名是：" + name);
        var age = confirm("您确定是18岁以上吗？");
        if (age) {
            alert("您是18岁以上");
        } else {
            alert("您不是18岁以上");
        }
    </script>
</body>
</html>
